
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sector Matrix Displaced</title>
    <link rel="stylesheet" href="404.css">
</head>
<body>

    <div class="err-bg-lighting-aura"></div>

    <main class="err-containment-card">
        
        <!-- Illustration Vector Section Area -->
        <div class="err-illustration-box">
            <div class="err-major-code-text">404</div>
            <!-- Professional Heart-in-Hand Unity Vector Asset Icon -->
            <svg class="err-floating-impact-vector" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,2,7.5,2c1.74,0,3.41,0.81,4.5,2.09C13.09,2.81,14.76,2,16.5,2C19.58,2,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z"/>
            </svg>
        </div>

        <h1>Mission Coordinate Missing</h1>
        <p>The campaign, donor document, or operational coordinate link you requested resides outside our active humanitarian registry parameters.</p>

        <!-- Twin Button Action Grid Block Array Component -->
        <div class="err-action-buttons-row">
            
            <!-- Button Link 1: Programmatic Section Return Hook -->
            <button class="btn-err-action type-back" id="err-trigger-go-back" aria-label="Return back directly to your previous active view section">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/>
                </svg>
                <span>Go Back</span>
            </button>

            <!-- Button Link 2: Central Base Anchor Redirection Route -->
            <a href="index.html" class="btn-err-action type-home" aria-label="Navigate securely back to the flagship homepage view">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/>
                </svg>
                <span>Return Home</span>
            </a>

        </div>

    </main>

  <style>
    /* ==========================================================================
   NGO PORTAL FALLBACK FRAMEWORK - STYLES DECK
   ========================================================================== */

:root {
    --bg-wash: #fff8f6;        /* Clear warm ivory baseline canvas wash */
    --text-forest: #2e7d32;    /* Balanced vibrant green accent for active growth/impact metrics */
    --ngo-orange: #e65100;     /* Warm humanitarian orange core theme token color */
    --white: #ffffff;
    --dark-neutral: #1a221e;   /* Premium high-contrast dark green slate text */
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background-color: var(--bg-wash);
    color: var(--dark-neutral);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 1.5rem;
    overflow: hidden;
    position: relative;
}

/* Ambient background lighting aura backdrop blur panel */
.err-bg-lighting-aura {
    position: absolute;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(230, 81, 0, 0.08) 0%, transparent 65%);
    z-index: 1;
    pointer-events: none;
}

/* Principal card wrapper layout frame matrix rules */
.err-containment-card {
    position: relative;
    background-color: var(--white);
    max-width: 560px;
    width: 100%;
    padding: 4rem 3rem;
    border-radius: 24px;
    border: 1px solid rgba(0,0,0,0.03);
    box-shadow: 0 20px 50px rgba(26, 34, 30, 0.03);
    text-align: center;
    z-index: 2;
    animation: errCardEntrance 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
}

/* Graphic Vector Illustration Area Layout */
.err-illustration-box {
    margin-bottom: 2rem;
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
}

.err-major-code-text {
    font-size: 7.5rem;
    font-weight: 900;
    color: var(--ngo-orange);
    line-height: 1;
    letter-spacing: -4px;
    opacity: 0.12;
    user-select: none;
}

.err-floating-impact-vector {
    position: absolute;
    width: 64px;
    height: 64px;
    fill: var(--text-forest);
    filter: drop-shadow(0 4px 12px rgba(46, 125, 50, 0.25));
    animation: errHeartFloat 4s ease-in-out infinite alternate;
}

.err-containment-card h1 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--dark-neutral);
    margin-bottom: 0.75rem;
    letter-spacing: -0.5px;
    line-height: 1.2;
}

.err-containment-card p {
    font-size: 1rem;
    color: #52635c;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
    font-weight: 500;
}

/* --- TWIN BUTTON ACTIONS GRID ALIGNMENT --- */
.err-action-buttons-row {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Mathematically splits width evenly to block shifts */
    gap: 1.25rem;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
}

.btn-err-action {
    text-decoration: none;
    cursor: pointer;
    border: none;
    padding: 1.1rem 1.5rem;
    border-radius: 30px; /* Reference matched capsule curvatures */
    font-size: 0.95rem;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    box-sizing: border-box;
}

/* Action key 1: Programmatic history backward router link */
.btn-err-action.type-back {
    background-color: var(--bg-wash);
    color: var(--ngo-orange);
    border: 1px solid rgba(230, 81, 0, 0.1);
}
.btn-err-action.type-back svg { fill: var(--ngo-orange); transition: transform 0.25s ease; }

.btn-err-action.type-back:hover {
    background-color: var(--ngo-orange);
    color: var(--white);
    border-color: var(--ngo-orange);
}
.btn-err-action.type-back:hover svg { fill: var(--white); transform: translateX(-4px); }

/* Action key 2: Primary baseline homepage index redirect link */
.btn-err-action.type-home {
    background-color: var(--text-forest);
    color: var(--white);
    box-shadow: 0 6px 15px rgba(46, 125, 50, 0.15);
}
.btn-err-action.type-home svg { fill: var(--white); transition: transform 0.25s ease; }

.btn-err-action.type-home:hover {
    background-color: var(--dark-neutral);
    box-shadow: 0 8px 25px rgba(26, 34, 30, 0.2);
}
.btn-err-action.type-home:hover svg { transform: scale(1.15); }

/* --- SEAMLESS LAYOUT SIGNAL ANIMATIONS MATRIX KEYFRAMES --- */
@keyframes errCardEntrance {
    0% { opacity: 0; transform: scale(0.96) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes errHeartFloat {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-10px) rotate(4deg); }
}

/* --- HIGH-PERFORMANCE RESPONSIVITY PORTAL SCREEN DECK BREAKPOINTS --- */
@media (max-width: 580px) {
    .err-containment-card { padding: 3rem 1.5rem; border-radius: 16px; }
    .err-major-code-text { font-size: 6rem; letter-spacing: -2px; }
    .err-floating-impact-vector { width: 54px; height: 54px; }
    .err-containment-card h1 { font-size: 1.6rem; }
    
    /* Collapse buttons cleanly to a single full-width vertical column layout stack on micro viewports */
    .err-action-buttons-row { grid-template-columns: 1fr; gap: 0.85rem; }
    .btn-err-action { width: 100%; }
}

  </style>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    
    const goBackTriggerNode = document.getElementById("err-trigger-go-back");

    if (goBackTriggerNode) {
        goBackTriggerNode.addEventListener("click", () => {
            
            // Evaluates cross-origin and intra-site memory lookups securely
            if (document.referrer && document.referrer !== "" && document.referrer !== window.location.href) {
                // Programmatic redirection anchors return User precisely to their previously active tab section
                window.location.href = document.referrer;
            } else {
                // Secondary hardware historical window lookup fail-safes layer pass
                window.history.back();
            }
        });
    }
});

</script>
</body>
</html>
